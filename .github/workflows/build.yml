name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # The default workflow token is read-only. Without this, the release step fails with
    # "Resource not accessible by integration" as soon as it tries to generate release
    # notes or upload the DLL asset.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore NuGet packages
        run: nuget restore dvbapi.net.sln

      # DllExport is not a PackageReference and is not covered by the restore above, but
      # packages/ is gitignored so it is absent on a fresh checkout. Without it the
      # csproj's ImportGroup is skipped, DllExportModImported stays != 'true' and the
      # project falls back to running "DllExport.bat -action Restore", whose wizard then
      # aborts with "We can't find any .sln file" and takes the whole build down.
      - name: Restore DllExport package
        run: nuget install DllExport -Version 1.7.0-beta -OutputDirectory packages -Pre -NonInteractive

      - name: Build (Release x86)
        run: msbuild dvbapi.net.sln /p:Configuration=Release /p:Platform=x86 /t:dvbapiNet /v:minimal

      # "dotnet test", not msbuild /t:VSTest: the VSTest target does not exist on this
      # SDK-style project (MSB4057). The test project is not in dvbapi.net.sln, so it
      # is referenced directly and restores its own PackageReference items.
      - name: Test (Release x86)
        continue-on-error: true
        run: dotnet test dvbapiNet.Tests/dvbapiNet.Tests.csproj -c Release -p:Platform=x86 --logger "trx;LogFileName=tests.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: dvbapiNet.Tests/**/tests.trx
          if-no-files-found: ignore

      - name: Upload DLL artifact
        uses: actions/upload-artifact@v4
        with:
          name: dvbapiNet
          path: dvbapiNet/bin/x86/Release/dvbapiNet.dll
          if-no-files-found: error

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dvbapiNet/bin/x86/Release/dvbapiNet.dll
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
